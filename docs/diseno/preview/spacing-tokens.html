<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: #fff; font-family: var(--font-body); }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .token { font-family: monospace; font-size: 10px; color: #999; width: 100px; flex-shrink: 0; }
  .bar { background: var(--color-blue-light); height: 100%; border-radius: 2px; }
  .value { font-size: 11px; color: #666; width: 36px; flex-shrink: 0; }
  .bar-wrap { flex: 1; height: 16px; background: #f0f0f0; border-radius: 2px; overflow: hidden; }
</style>
</head>
<body>
  <div class="row"><span class="token">--space-1</span><span class="value">4px</span><div class="bar-wrap"><div class="bar" style="width:2%"></div></div></div>
  <div class="row"><span class="token">--space-2</span><span class="value">8px</span><div class="bar-wrap"><div class="bar" style="width:4%"></div></div></div>
  <div class="row"><span class="token">--space-3</span><span class="value">12px</span><div class="bar-wrap"><div class="bar" style="width:6%"></div></div></div>
  <div class="row"><span class="token">--space-4</span><span class="value">16px</span><div class="bar-wrap"><div class="bar" style="width:8%"></div></div></div>
  <div class="row"><span class="token">--space-5</span><span class="value">20px</span><div class="bar-wrap"><div class="bar" style="width:10%"></div></div></div>
  <div class="row"><span class="token">--space-6</span><span class="value">24px</span><div class="bar-wrap"><div class="bar" style="width:12%"></div></div></div>
  <div class="row"><span class="token">--space-8</span><span class="value">32px</span><div class="bar-wrap"><div class="bar" style="width:16%"></div></div></div>
  <div class="row"><span class="token">--space-10</span><span class="value">40px</span><div class="bar-wrap"><div class="bar" style="width:20%"></div></div></div>
  <div class="row"><span class="token">--space-12</span><span class="value">48px</span><div class="bar-wrap"><div class="bar" style="width:24%"></div></div></div>
  <div class="row"><span class="token">--space-16</span><span class="value">64px</span><div class="bar-wrap"><div class="bar" style="width:32%"></div></div></div>
  <div class="row"><span class="token">--space-20</span><span class="value">80px</span><div class="bar-wrap"><div class="bar" style="width:40%"></div></div></div>
  <div class="row"><span class="token">--space-24</span><span class="value">96px</span><div class="bar-wrap"><div class="bar" style="width:48%"></div></div></div>
</body></html>
