<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: #fff; font-family: var(--font-body); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 80px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid #eee; }
  .color-block { height: 72px; }
  .info { padding: 6px 8px; }
  .name { font-size: 11px; font-weight: 600; color: #333; }
  .hex { font-size: 10px; color: #666; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <div class="color-block" style="background:#1A1A1A"></div>
    <div class="info"><div class="name">Dark</div><div class="hex">#1A1A1A</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#44546A"></div>
    <div class="info"><div class="name">Gray Dark</div><div class="hex">#44546A</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#767676"></div>
    <div class="info"><div class="name">Gray</div><div class="hex">#767676</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#E7E6E6"></div>
    <div class="info"><div class="name">Gray Light</div><div class="hex">#E7E6E6</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#F5F5F5"></div>
    <div class="info"><div class="name">Gray Pale</div><div class="hex">#F5F5F5</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#FFFFFF"></div>
    <div class="info"><div class="name">White</div><div class="hex">#FFFFFF</div></div>
  </div>
</div>
</body></html>
