<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: #fff; font-family: var(--font-body); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 100px; border-radius: var(--radius-md); overflow: hidden; }
  .color-block { height: 72px; }
  .info { padding: 6px 8px; }
  .name { font-size: 11px; font-weight: 600; color: #333; }
  .hex { font-size: 10px; color: #666; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <div class="color-block" style="background:#1A5CA8"></div>
    <div class="info"><div class="name">Blue (Primary)</div><div class="hex">#1A5CA8</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#0F3F78"></div>
    <div class="info"><div class="name">Blue Dark</div><div class="hex">#0F3F78</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#0F6FC6"></div>
    <div class="info"><div class="name">Blue Mid</div><div class="hex">#0F6FC6</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#5B9BD5"></div>
    <div class="info"><div class="name">Blue Light</div><div class="hex">#5B9BD5</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#DBF5F9"></div>
    <div class="info"><div class="name">Blue Pale</div><div class="hex">#DBF5F9</div></div>
  </div>
</div>
</body></html>
