<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: #fff; font-family: var(--font-body); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 100px; border-radius: var(--radius-md); overflow: hidden; }
  .color-block { height: 72px; }
  .info { padding: 6px 8px; }
  .name { font-size: 11px; font-weight: 600; color: #333; }
  .hex { font-size: 10px; color: #666; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <div class="color-block" style="background:#4F8C1E"></div>
    <div class="info"><div class="name">Green (Secondary)</div><div class="hex">#4F8C1E</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#3A6614"></div>
    <div class="info"><div class="name">Green Dark</div><div class="hex">#3A6614</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#7CCA62"></div>
    <div class="info"><div class="name">Green Mid</div><div class="hex">#7CCA62</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#A5C249"></div>
    <div class="info"><div class="name">Green Light</div><div class="hex">#A5C249</div></div>
  </div>
  <div class="swatch">
    <div class="color-block" style="background:#04617B"></div>
    <div class="info"><div class="name">Teal</div><div class="hex">#04617B</div></div>
  </div>
</div>
</body></html>
